<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    Se o app Web for hospedado em um subcaminho (ex.: GitHub Pages /meu-repo/),
    passe `--base-href /meu-repo/` no comando `flutter build web`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14181C">

  <!-- SEO -->
  <title>CineBoxd • Qual tem a Maior Nota?</title>
  <meta name="description" content="Jogo estilo Higher or Lower com notas médias de filmes no Letterboxd. Escolha qual filme tem a maior nota e bata seu recorde!">
  <meta name="keywords" content="CineBoxd, Letterboxd, Higher or Lower, jogo de filmes, cinema, quiz de filmes, notas Letterboxd">

  <!-- Open Graph (WhatsApp, Discord, Facebook, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="CineBoxd">
  <meta property="og:title" content="CineBoxd • Qual tem a Maior Nota?">
  <meta property="og:description" content="Dois filmes na tela: toque naquele que você acha que tem a maior nota no Letterboxd e veja até onde sua sequência chega!">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="CineBoxd • Qual tem a Maior Nota?">
  <meta name="twitter:description" content="Dois filmes na tela: toque naquele que você acha que tem a maior nota no Letterboxd e bata seu recorde!">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- PWA / Mobile Web App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineBoxd">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #14181C;
      color: #F4F7FA;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #loading-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #14181C;
      pointer-events: none;
      transition: opacity 260ms ease-out;
    }

    #loading-splash.fade-out {
      opacity: 0;
    }

    .splash-card {
      width: 100%;
      max-width: 340px;
      padding: 28px 24px 24px;
      background-color: #1C2228;
      border: 1.5px solid #38424D;
      border-radius: 0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .letterboxd-dots {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dot-orange {
      background-color: #FF8000;
      animation-delay: 0s;
    }

    .dot-green {
      background-color: #00E054;
      animation-delay: 0.18s;
    }

    .dot-blue {
      background-color: #40BCF4;
      animation-delay: 0.36s;
    }

    .splash-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: #F4F7FA;
      text-transform: uppercase;
    }

    .splash-subtitle {
      margin: 6px 0 20px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #9AB0C4;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background-color: #283038;
      border-radius: 0;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 42%;
      background-color: #00E054;
      border-radius: 0;
      animation: loadingSlide 1.15s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: scale(0.88);
        opacity: 0.65;
      }
      40% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    @keyframes loadingSlide {
      0% {
        left: -42%;
      }
      100% {
        left: 100%;
      }
    }

    noscript {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #14181C;
      color: #F4F7FA;
      text-align: center;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="loading-splash" role="status" aria-live="polite">
    <div class="splash-card">
      <div class="letterboxd-dots" aria-hidden="true">
        <span class="dot dot-orange"></span>
        <span class="dot dot-green"></span>
        <span class="dot dot-blue"></span>
      </div>
      <h1 class="splash-title">CineBoxd</h1>
      <p class="splash-subtitle">QUAL TEM A MAIOR NOTA?</p>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <noscript>
    Ative o JavaScript no navegador para jogar o CineBoxd • Qual tem a Maior Nota?.
  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(function () {
        if (splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }, 280);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
